lags:
  tws: [1, 3, 6, 12]
  covariates: [1, 3]

rolling_windows: [3, 6, 12]

# Masquage augmenté (Phase 3) — mode dynamique uniquement, jamais figé sur disque.
# Taux réel de mois-trous dans le train : ~13.8% (22/160), concentré après 2011 (0% avant,
# 33-42% en 2011-2014). Le test échantillonne une période plus dure (67% de ses mois sont des
# trous) : l'échelle ci-dessous s'en rapproche vers la fin du train plutôt que de coller
# uniquement à l'historique. Point de départ à ajuster en Phase 5 (itération E), pas figé.
masking:
  target_gap_rate_by_period:
    - {start_year: 2002, end_year: 2010, rate: 0.05}
    - {start_year: 2011, end_year: 2014, rate: 0.35}
    - {start_year: 2015, end_year: 2015, rate: 0.50}
